<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChetMedia | Панель Администратора</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0F0F11; }
        .blur-gradient { background: linear-gradient(135deg, rgba(239,68,68,0.08) 0%, rgba(114,137,218,0.05) 100%); }
    </style>
</head>
<body class="text-gray-200 min-h-screen font-sans">

    <div class="fixed top-0 left-0 w-full h-full blur-gradient -z-10 pointer-events-none"></div>

    <div class="container mx-auto max-w-5xl px-4 py-8">
        
        <header class="flex justify-between items-center border-b border-gray-900 pb-6 mb-8">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Панель Администратора</h1>
                    <p class="text-gray-500 text-xs mt-0.5">Управление пользователями и модерация медиатеки</p>
                </div>
            </div>
            <div>
                <a href="/" class="text-xs text-gray-400 hover:text-blue-400 border border-gray-800 bg-gray-900/40 px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> На главную
                </a>
            </div>
        </header>

        <main class="bg-gray-950/40 border border-gray-900 rounded-2xl overflow-hidden backdrop-blur-md shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-900 bg-gray-900/20 text-gray-400 text-xs font-semibold uppercase tracking-wider">
                            <th class="px-6 py-4">ID (Discord)</th>
                            <th class="px-6 py-4">Имя пользователя</th>
                            <th class="px-6 py-4">Статус</th>
                            <th class="px-6 py-4 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-table" class="divide-y divide-gray-900 text-sm">
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                <i class="fa-solid fa-circle-notch animate-spin mr-2 text-red-500"></i> Загрузка списка пользователей...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="mediaModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-gray-950 border border-gray-900 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-gray-900 flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-amber-500"></i> Медиатека: <span id="modalUsername" class="text-blue-400"></span>
                    </h3>
                    <p class="text-gray-500 text-xs mt-0.5">Список файлов, загруженных пользователем</p>
                </div>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white text-xl cursor-pointer p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto space-y-4 flex-grow">
                </div>
        </div>
    </div>

    <script>
        let currentOpenUserId = null;

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                if (response.ok) {
                    const data = await response.json();
                    const tbody = document.getElementById('users-table');
                    if (!tbody) return;
                    tbody.innerHTML = ''; 
                    
                    if (!data.users || data.users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">База данных пуста</td></tr>';
                        return;
                    }
                    
                    data.users.forEach(user => {
                        const tr = document.createElement('tr');
                        let rowBgClass = 'hover:bg-gray-900/20 transition-colors';
                        let statusBadge = '';
                        let actionButtons = '';

                        // Кнопка просмотра медиатеки доступна для всех
                        const mediaBtn = `<button onclick="viewUserMedia('${user.id}', '${user.username}')" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 text-xs font-medium py-1.5 px-3 rounded-xl transition-all cursor-pointer mr-2"><i class="fa-solid fa-images mr-1"></i> Медиатека</button>`;

                        if (user.is_blocked) {
                            rowBgClass = 'bg-red-950/10 hover:bg-red-950/15 transition-colors';
                            statusBadge = `<span class="bg-red-500/10 text-red-400 border border-red-900/30 text-[11px] px-2.5 py-1 rounded-full font-medium"><i class="fa-solid fa-ban text-[10px] mr-1"></i> Заблокирован</span>`;
                            actionButtons = mediaBtn + `
                                <button onclick="unblockUser('${user.id}')" class="bg-emerald-950/40 hover:bg-emerald-900/40 border border-emerald-900 text-emerald-400 text-xs font-medium py-1.5 px-4 rounded-xl transition-all cursor-pointer">
                                    Разблокировать
                                </button>`;
                        } else if (user.is_admin) {
                            rowBgClass = 'bg-blue-950/5 hover:bg-blue-950/10 transition-colors';
                            statusBadge = `<span class="bg-blue-500/10 text-blue-400 border border-blue-900/30 text-[11px] px-2.5 py-1 rounded-full font-medium"><i class="fa-solid fa-crown text-[10px] mr-1"></i> Администратор</span>`;
                            actionButtons = mediaBtn + `<span class="text-xs text-gray-500 font-medium italic mr-2">Вы</span>`;
                        } else {
                            statusBadge = `<span class="bg-gray-800 text-gray-400 text-[11px] px-2.5 py-1 rounded-full font-medium"><i class="fa-solid fa-user text-[10px] mr-1"></i> Пользователь</span>`;
                            actionButtons = mediaBtn + `
                                <button onclick="blockUser('${user.id}')" class="bg-red-950/40 hover:bg-red-900/40 border border-red-950 text-red-400 text-xs font-medium py-1.5 px-4 rounded-xl transition-all cursor-pointer">
                                    Заблокировать
                                </button>`;
                        }

                        tr.className = rowBgClass;
                        tr.innerHTML = `
                            <td class="px-6 py-4 font-mono text-xs text-gray-400">${user.id}</td>
                            <td class="px-6 py-4 font-semibold text-gray-200">${user.username}</td>
                            <td class="px-6 py-4">${statusBadge}</td>
                            <td class="px-6 py-4 text-right flex items-center justify-end h-full mt-2">${actionButtons}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) { console.error(err); }
        }

        // ОТКРЫТИЕ МОДАЛКИ С ФАЙЛАМИ ЮЗЕРА
        async function viewUserMedia(userId, username) {
            currentOpenUserId = userId;
            document.getElementById('modalUsername').innerText = username;
            const content = document.getElementById('modalContent');
            content.innerHTML = '<div class="text-center text-gray-500 py-6"><i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Получение файлов...</div>';
            document.getElementById('mediaModal').classList.remove('hidden');

            try {
                const res = await fetch(`/api/admin/users/${userId}/media`);
                if (res.ok) {
                    const files = await res.json();
                    content.innerHTML = '';

                    if (files.length === 0) {
                        content.innerHTML = '<div class="text-center text-gray-500 py-8 text-sm"><i class="fa-solid fa-folder-open text-xl mb-2 block"></i> У этого пользователя нет загруженных файлов.</div>';
                        return;
                    }

                    files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = "bg-gray-900/50 border border-gray-900 p-4 rounded-xl flex justify-between items-center gap-4 hover:border-gray-800 transition-all";
                        
                        let icon = 'fa-file-video text-blue-500';
                        if (file.album_id) icon = 'fa-images text-teal-400';
                        else if (file.content_type.startsWith('image/')) icon = 'fa-file-image text-purple-500';

                        const title = file.album_id ? `Альбом [id: ${file.album_id}]` : file.filename;

                        item.innerHTML = `
                            <div class="min-w-0 flex items-center gap-3">
                                <i class="fa-solid ${icon} text-lg shrink-0"></i>
                                <div class="min-w-0">
                                    <a href="${file.url}" target="_blank" class="text-sm font-semibold text-gray-200 hover:text-blue-400 hover:underline truncate block" title="Открыть контент">${title}</a>
                                    <span class="text-[10px] text-gray-500 block mt-0.5">Сгорает: ${file.expires_at}</span>
                                </div>
                            </div>
                            <button onclick="deleteFileAdmin('${file.id}')" class="bg-red-950/20 hover:bg-red-900/30 border border-red-950 text-red-400 p-2 rounded-lg text-xs transition-colors cursor-pointer shrink-0" title="Удалить принудительно">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        `;
                        content.appendChild(item);
                    });
                }
            } catch (err) { console.error(err); }
        }

        // АДМИНИСТРАТИВНОЕ УДАЛЕНИЕ ОДНОГО ФАЙЛА/АЛЬБОМА
        async function deleteFileAdmin(fileId) {
            if (!confirm('Принудительно удалить этот файл/альбом с сервера?')) return;
            const res = await fetch(`/api/admin/media/${fileId}`, { method: 'DELETE' });
            if (res.ok) {
                // Обновляем список файлов внутри модалки
                const username = document.getElementById('modalUsername').innerText;
                viewUserMedia(currentOpenUserId, username);
            }
        }

        function closeModal() {
            document.getElementById('mediaModal').classList.add('hidden');
        }

        async function blockUser(userId) {
            if (!confirm('Заблокировать юзера и удалить ВСЕ файлы?')) return;
            const res = await fetch(`/api/admin/users/${userId}/block`, { method: 'POST' });
            if (res.ok) loadUsers();
        }

        async function unblockUser(userId) {
            if (!confirm('Разблокировать пользователя?')) return;
            const res = await fetch(`/api/admin/users/${userId}/unblock`, { method: 'POST' });
            if (res.ok) loadUsers();
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
