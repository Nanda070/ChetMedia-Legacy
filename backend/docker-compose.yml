version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Пробрасываем папку uploads и базу данных на реальный диск сервера для вечного хранения
      - ./uploads:/workspace/uploads
      - ./chetmedia.db:/workspace/chetmedia.db
    environment:
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    restart: always